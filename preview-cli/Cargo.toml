[package]
name = "vimg-preview"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Lightweight native static preview helper for vimg"
publish = false

[dependencies]
anyhow = "1.0.69"
clap = { version = "4.1.8", features = ["derive", "env", "wrap_help"] }
ctrlc = { version = "3.2.5", features = ["termination"] }
fastrand = { version = "2", optional = true }
ffmpeg-next = { version = "8.1.0", default-features = false, features = ["filter", "format", "software-scaling"], optional = true }
serde_json = "1"

[features]
default = ["in-process-decode"]
in-process-decode = ["dep:ffmpeg-next", "dep:fastrand"]

[lints.rust]
unused_crate_dependencies = "deny"
